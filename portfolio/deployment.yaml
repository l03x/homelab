apiVersion: apps/v1
kind: Deployment
metadata:
  name: sefaultd
  namespace: portfolio
spec:
  replicas: 1
  strategy:
    type: Recreate                      # RWO logs volume + hostPort
  selector:
    matchLabels: { app: sefaultd }
  template:
    metadata:
      labels: { app: sefaultd }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: app
          image: docker.io/library/portfolio-app:latest
          imagePullPolicy: Never              # built locally and imported into k3s
          ports:
            - containerPort: 8080
              hostPort: 8081                  # host 8080 is taken by qBittorrent
              hostIP: 127.0.0.1               # the tunnel reaches it at localhost:8081
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { memory: 32Mi, cpu: 50m }
            limits: { memory: 64Mi, cpu: 500m }
          volumeMounts:
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: logs
