apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate                      # SQLite on an RWO volume + hostPort
  selector:
    matchLabels: { app: n8n }
  template:
    metadata:
      labels: { app: n8n }
    spec:
      enableServiceLinks: false         # otherwise k8s injects N8N_PORT=tcp://... and n8n fails to start
      securityContext:
        fsGroup: 1000                   # the image's node user
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest   # pin a version tag
          envFrom:
            - secretRef:
                name: n8n-env
          env:
            - { name: N8N_PORT, value: "5678" }
            - { name: N8N_PROXY_HOPS, value: "1" }           # trust X-Forwarded-For from the tunnel
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }
            - { name: N8N_PERSONALIZATION_ENABLED, value: "false" }
          ports:
            - containerPort: 5678
              hostPort: 5678
              hostIP: 127.0.0.1               # the tunnel reaches it at localhost:5678
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: { path: /healthz, port: 5678 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 5678 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
