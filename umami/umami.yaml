apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: umami
spec:
  replicas: 1
  strategy:
    type: Recreate                      # hostPort: the old pod must free it first
  selector:
    matchLabels: { app: umami }
  template:
    metadata:
      labels: { app: umami }
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command: ["sh", "-c", "until pg_isready -h db -U umami; do sleep 2; done"]
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:latest   # pin a version tag
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: umami-env, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql://umami:$(POSTGRES_PASSWORD)@db:5432/umami
            - name: APP_SECRET
              valueFrom: { secretKeyRef: { name: umami-env, key: APP_SECRET } }
            - name: TWO_FACTOR_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: umami-env, key: TWO_FACTOR_ENCRYPTION_KEY } }
          ports:
            - containerPort: 3000
              hostPort: 3000
              hostIP: 127.0.0.1               # the tunnel reaches it at localhost:3000
          readinessProbe:
            httpGet: { path: /api/heartbeat, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/heartbeat, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 512Mi }
