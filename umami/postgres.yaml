apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: umami
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: umami
spec:
  replicas: 1
  strategy:
    type: Recreate                      # two Postgres processes on one data dir = corruption
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:15-alpine       # data is tied to the major version
          env:
            - { name: POSTGRES_DB, value: umami }
            - { name: POSTGRES_USER, value: umami }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: umami-env, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U umami -d umami"]
            periodSeconds: 5
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: umami
spec:
  selector: { app: db }
  ports:
    - port: 5432
      targetPort: 5432
