apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate                      # SQLite config on RWO volume + hostPort
  selector:
    matchLabels: { app: qbittorrent }
  template:
    metadata:
      labels: { app: qbittorrent }
    spec:
      enableServiceLinks: false
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: "Africa/Casablanca" }
            - { name: WEBUI_PORT, value: "8080" }
          ports:
            - containerPort: 8080
              hostPort: 8080                    # all interfaces = LAN + Tailscale
            - containerPort: 6881
              hostPort: 6881
              protocol: TCP                 # torrent peers
            - containerPort: 6881
              hostPort: 6881
              protocol: UDP                 # torrent peers
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data0, mountPath: /data/torrents }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: qbittorrent-config }
        - name: data0
          hostPath: { path: /srv/data/torrents, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  selector: { app: qbittorrent }
  ports:
    - port: 8080
      targetPort: 8080
