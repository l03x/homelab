apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels: { app: flaresolverr }
  template:
    metadata:
      labels: { app: flaresolverr }
    spec:
      enableServiceLinks: false
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          env:
            - { name: TZ, value: "Africa/Casablanca" }
            - { name: LOG_LEVEL, value: "info" }
          ports:
            - containerPort: 8191                 # no hostPort: only Prowlarr uses it, via its Service
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: media
spec:
  selector: { app: flaresolverr }
  ports:
    - port: 8191
      targetPort: 8191
