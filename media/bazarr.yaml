apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate                      # SQLite config on RWO volume + hostPort
  selector:
    matchLabels: { app: bazarr }
  template:
    metadata:
      labels: { app: bazarr }
    spec:
      enableServiceLinks: false
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: "Africa/Casablanca" }
          ports:
            - containerPort: 6767
              hostPort: 6767                    # all interfaces = LAN + Tailscale
          resources:
            requests: { memory: 160Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data0, mountPath: /data/media }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: bazarr-config }
        - name: data0
          hostPath: { path: /srv/data/media, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
spec:
  selector: { app: bazarr }
  ports:
    - port: 6767
      targetPort: 6767
