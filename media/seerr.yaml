apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate                      # SQLite config on RWO volume + hostPort
  selector:
    matchLabels: { app: seerr }
  template:
    metadata:
      labels: { app: seerr }
    spec:
      enableServiceLinks: false
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          env:
            - { name: TZ, value: "Africa/Casablanca" }
          ports:
            - containerPort: 5055
              hostPort: 5055                    # all interfaces = LAN + Tailscale
          resources:
            requests: { memory: 160Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /app/config }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: seerr-config }
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
spec:
  selector: { app: seerr }
  ports:
    - port: 5055
      targetPort: 5055
