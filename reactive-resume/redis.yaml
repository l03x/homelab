apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: reactive-resume
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources:
            requests: { memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}                    # transient session/stream data only
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: reactive-resume
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
