apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: reactive-resume
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: reactive-resume
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18              # pinned: data on disk is tied to the major version
          env:
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rr-env, key: POSTGRES_PASSWORD } }
          ports:
            - containerPort: 5432         # no hostPort: only the app reaches it
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "postgres"] }
            periodSeconds: 10
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql   # PG 18+ layout
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: reactive-resume
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
