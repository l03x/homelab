apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: reactive-resume
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: reactive-resume
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest   # pin a release tag
          args: ["server", "-s3", "-filer", "-dir=/data", "-ip=0.0.0.0", "-telemetry=false"]
          env:                            # same as compose; S3 is internal-only (no hostPort)
            - { name: AWS_ACCESS_KEY_ID, value: seaweedfs }
            - { name: AWS_SECRET_ACCESS_KEY, value: seaweedfs }
          ports:
            - containerPort: 8333         # no hostPort: only the app reaches it
          readinessProbe:
            httpGet: { path: /, port: 8888 }
            periodSeconds: 10
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: reactive-resume
spec:
  selector: { app: seaweedfs }
  ports:
    - port: 8333
      targetPort: 8333
