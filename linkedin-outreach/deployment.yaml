apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: linkedin-outreach
spec:
  replicas: 1
  strategy:
    type: Recreate                      # SQLite on an RWO volume + hostPort
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      enableServiceLinks: false
      containers:
        - name: backend
          image: ghcr.io/l03x/linkedin-message-extension:latest
          ports:
            - containerPort: 8000
              hostPort: 8765
              hostIP: 127.0.0.1           # the extension and dashboard call http://localhost:8765
          envFrom:
            - secretRef:
                name: backend-env
          resources:
            requests: { memory: 128Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
